name: Check CROUS listings

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crous-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_URLS: ${{ secrets.SEARCH_URLS }}
        run: python crous_notifier.py

      - name: Persist seen listings
        run: |
          git config user.name "crous-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_ids.json subscribers.json update_offset.json
          git diff --staged --quiet || git commit -m "update seen listings"
          git push
